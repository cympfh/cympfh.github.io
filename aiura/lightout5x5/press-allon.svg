<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 162 180" role="img" aria-labelledby="title desc">
  <title id="title">全部点灯を消す押し方。1行目は (1,1) と (1,2)</title>
  <desc id="desc">明るいマスを1回押す。1行目は左の2つ、2行目は1 2 4 5、3行目は3 4 5、4行目は2 3 4、5行目は2 3 5。</desc>

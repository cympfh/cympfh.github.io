<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 404" role="img" aria-labelledby="title desc">
  <title id="title">全部消えている状態で左上と中央を押したときの反転</title>
  <desc id="desc">左上 (1 1) を押すと (1 1) (1 2) (2 1) の3つが点灯する。中央 (3 3) を押すと (3 3) と上下左右の5つが点灯する。斜めは反転しない。</desc>
  <style>
    .off { fill: #1c2430; stroke: #3a4658; stroke-width: 1; }
    .on { fill: #f2c14e; stroke: #9a6b12; stroke-width: 1.6; }
    .aim { fill: #1c2430; stroke: #e07a1f; stroke-width: 2.4; }
    .cap { font-family: "Noto Sans CJK JP"; font-size: 15px; fill: #2a2118; }
    .sub { font-family: "Noto Sans CJK JP"; font-size: 12px; fill: #5c4a3a; }
    .idx { font-family: sans-serif; font-size: 10px; font-weight: 700; fill: #2a2118; }
    .aimtext { font-family: sans-serif; font-size: 10px; font-weight: 700; fill: #e07a1f; }
  </style>

  <text class="cap" x="0" y="16">左上 (1,1) を押す</text>
  <text class="sub" x="0" y="36">押す前</text>
  <text class="sub" x="172" y="36">押したあと</text>


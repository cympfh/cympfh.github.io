<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 0 508 196" role="img" aria-labelledby="title desc">
  <title id="title">ライトチェイスの1行。点いているボタンの真下を押すと、その行が消える</title>
  <desc id="desc">1行目の (1,2) と (1,4) が点灯している。2行目の (2,2) と (2,4) を押すと、1行目は消える。押したボタン自身と、その左右と下は反転する。</desc>
  <style>
    .off { fill: #1c2430; stroke: #3a4658; stroke-width: 1; }
    .on { fill: #f2c14e; stroke: #9a6b12; stroke-width: 1.6; }
    .aim { fill: #1c2430; stroke: #e07a1f; stroke-width: 2.4; }
    .cap { font-family: "Noto Sans CJK JP"; font-size: 14px; fill: #2a2118; }
    .sub { font-family: "Noto Sans CJK JP"; font-size: 12px; fill: #5c4a3a; }
    .idx { font-family: sans-serif; font-size: 10px; font-weight: 700; fill: #2a2118; }
    .aimtext { font-family: sans-serif; font-size: 10px; font-weight: 700; fill: #e07a1f; }
  </style>

  <text class="cap" x="0" y="16">1行目が点いている</text>
  <text class="sub" x="0" y="34">押す前</text>
  <text class="cap" x="172" y="16">点灯の真下を押す</text>
  <text class="sub" x="172" y="34">押すボタン</text>
  <text class="cap" x="344" y="16">1行目は消える</text>
  <text class="sub" x="344" y="34">押したあと</text>

  <!-- before: row1 cols 2 and 4 on -->
  <g transform="translate(0,46)">
    <rect class="off" x="0" y="0" width="26" height="26" rx="2"/>
    <rect class="on" x="30" y="0" width="26" height="26" rx="2"/>
    <text class="idx" x="43" y="17" text-anchor="middle">1,2</text>
    <rect class="off" x="60" y="0" width="26" height="26" rx="2"/>
    <rect class="on" x="90" y="0" width="26" height="26" rx="2"/>
    <text class="idx" x="103" y="17" text-anchor="middle">1,4</text>
    <rect class="off" x="120" y="0" width="26" height="26" rx="2"/>
    <rect class="off" x="0" y="30" width="26" height="26" rx="2"/>
    <rect class="off" x="30" y="30" width="26" height="26" rx="2"/>
    <rect class="off" x="60" y="30" width="26" height="26" rx="2"/>
    <rect class="off" x="90" y="30" width="26" height="26" rx="2"/>
    <rect class="off" x="120" y="30" width="26" height="26" rx="2"/>
    <rect class="off" x="0" y="60" width="26" height="26" rx="2"/>
    <rect class="off" x="30" y="60" width="26" height="26" rx="2"/>
    <rect class="off" x="60" y="60" width="26" height="26" rx="2"/>
    <rect class="off" x="90" y="60" width="26" height="26" rx="2"/>
    <rect class="off" x="120" y="60" width="26" height="26" rx="2"/>
    <rect class="off" x="0" y="90" width="26" height="26" rx="2"/>
    <rect class="off" x="30" y="90" width="26" height="26" rx="2"/>
    <rect class="off" x="60" y="90" width="26" height="26" rx="2"/>
    <rect class="off" x="90" y="90" width="26" height="26" rx="2"/>
    <rect class="off" x="120" y="90" width="26" height="26" rx="2"/>
    <rect class="off" x="0" y="120" width="26" height="26" rx="2"/>
    <rect class="off" x="30" y="120" width="26" height="26" rx="2"/>
    <rect class="off" x="60" y="120" width="26" height="26" rx="2"/>
    <rect class="off" x="90" y="120" width="26" height="26" rx="2"/>
    <rect class="off" x="120" y="120" width="26" height="26" rx="2"/>
  </g>

  <!-- press (2,2) and (2,4) -->
  <g transform="translate(172,46)">
    <rect class="off" x="0" y="0" width="26" height="26" rx="2"/>
    <rect class="on" x="30" y="0" width="26" height="26" rx="2"/>
    <text class="idx" x="43" y="17" text-anchor="middle">1,2</text>
    <rect class="off" x="60" y="0" width="26" height="26" rx="2"/>
    <rect class="on" x="90" y="0" width="26" height="26" rx="2"/>
    <text class="idx" x="103" y="17" text-anchor="middle">1,4</text>
    <rect class="off" x="120" y="0" width="26" height="26" rx="2"/>
    <rect class="off" x="0" y="30" width="26" height="26" rx="2"/>
    <rect class="aim" x="30" y="30" width="26" height="26" rx="2"/>
    <text class="aimtext" x="43" y="47" text-anchor="middle">2,2</text>
    <rect class="off" x="60" y="30" width="26" height="26" rx="2"/>
    <rect class="aim" x="90" y="30" width="26" height="26" rx="2"/>
    <text class="aimtext" x="103" y="47" text-anchor="middle">2,4</text>
    <rect class="off" x="120" y="30" width="26" height="26" rx="2"/>
    <rect class="off" x="0" y="60" width="26" height="26" rx="2"/>
    <rect class="off" x="30" y="60" width="26" height="26" rx="2"/>
    <rect class="off" x="60" y="60" width="26" height="26" rx="2"/>
    <rect class="off" x="90" y="60" width="26" height="26" rx="2"/>
    <rect class="off" x="120" y="60" width="26" height="26" rx="2"/>
    <rect class="off" x="0" y="90" width="26" height="26" rx="2"/>
    <rect class="off" x="30" y="90" width="26" height="26" rx="2"/>
    <rect class="off" x="60" y="90" width="26" height="26" rx="2"/>
    <rect class="off" x="90" y="90" width="26" height="26" rx="2"/>
    <rect class="off" x="120" y="90" width="26" height="26" rx="2"/>
    <rect class="off" x="0" y="120" width="26" height="26" rx="2"/>
    <rect class="off" x="30" y="120" width="26" height="26" rx="2"/>
    <rect class="off" x="60" y="120" width="26" height="26" rx="2"/>
    <rect class="off" x="90" y="120" width="26" height="26" rx="2"/>
    <rect class="off" x="120" y="120" width="26" height="26" rx="2"/>
  </g>

  <!-- after pressing (2,2) and (2,4) on the before board.
       (2,2) toggles (2,2)(1,2)(3,2)(2,1)(2,3)
       (2,4) toggles (2,4)(1,4)(3,4)(2,3)(2,5)
       (2,3) toggled twice, stays off.
       row1 ends off. row2: cols 1,2,4,5 on. row3: cols 2,4 on. -->
  <g transform="translate(344,46)">
    <rect class="off" x="0" y="0" width="26" height="26" rx="2"/>
    <rect class="off" x="30" y="0" width="26" height="26" rx="2"/>
    <rect class="off" x="60" y="0" width="26" height="26" rx="2"/>
    <rect class="off" x="90" y="0" width="26" height="26" rx="2"/>
    <rect class="off" x="120" y="0" width="26" height="26" rx="2"/>
    <rect class="on" x="0" y="30" width="26" height="26" rx="2"/>
    <text class="idx" x="13" y="47" text-anchor="middle">2,1</text>
    <rect class="on" x="30" y="30" width="26" height="26" rx="2"/>
    <text class="idx" x="43" y="47" text-anchor="middle">2,2</text>
    <rect class="off" x="60" y="30" width="26" height="26" rx="2"/>
    <rect class="on" x="90" y="30" width="26" height="26" rx="2"/>
    <text class="idx" x="103" y="47" text-anchor="middle">2,4</text>
    <rect class="on" x="120" y="30" width="26" height="26" rx="2"/>
    <text class="idx" x="133" y="47" text-anchor="middle">2,5</text>
    <rect class="off" x="0" y="60" width="26" height="26" rx="2"/>
    <rect class="on" x="30" y="60" width="26" height="26" rx="2"/>
    <text class="idx" x="43" y="77" text-anchor="middle">3,2</text>
    <rect class="off" x="60" y="60" width="26" height="26" rx="2"/>
    <rect class="on" x="90" y="60" width="26" height="26" rx="2"/>
    <text class="idx" x="103" y="77" text-anchor="middle">3,4</text>
    <rect class="off" x="120" y="60" width="26" height="26" rx="2"/>
    <rect class="off" x="0" y="90" width="26" height="26" rx="2"/>
    <rect class="off" x="30" y="90" width="26" height="26" rx="2"/>
    <rect class="off" x="60" y="90" width="26" height="26" rx="2"/>
    <rect class="off" x="90" y="90" width="26" height="26" rx="2"/>
    <rect class="off" x="120" y="90" width="26" height="26" rx="2"/>
    <rect class="off" x="0" y="120" width="26" height="26" rx="2"/>
    <rect class="off" x="30" y="120" width="26" height="26" rx="2"/>
    <rect class="off" x="60" y="120" width="26" height="26" rx="2"/>
    <rect class="off" x="90" y="120" width="26" height="26" rx="2"/>
    <rect class="off" x="120" y="120" width="26" height="26" rx="2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 196" role="img" aria-labelledby="title desc">
  <title id="title">ボタンの座標。行が上から 1 から 5、列が左から 1 から 5</title>
  <desc id="desc">左上が (1,1)、右上が (1,5)、左下が (5,1)、右下が (5,5)、中央が (3,3)。第1成分が行、第2成分が列。</desc>

  <style>
    .cell { fill: #1c2430; stroke: #3a4658; stroke-width: 1; }
    .idx { font-family: sans-serif; font-size: 11px; font-weight: 700; fill: #f6f1e4; }
    .axis { font-family: "Noto Sans CJK JP"; font-size: 13px; fill: #5c4a3a; }
    .num { font-family: sans-serif; font-size: 13px; font-weight: 700; fill: #5c4a3a; }
  </style>
  <text class="axis" x="16" y="16">行</text>
  <text class="axis" x="194" y="16" text-anchor="end">列</text>
  <g transform="translate(36,46)">
    <text class="num" x="13" y="-8" text-anchor="middle">1</text>
    <text class="num" x="43" y="-8" text-anchor="middle">2</text>
    <text class="num" x="73" y="-8" text-anchor="middle">3</text>
    <text class="num" x="103" y="-8" text-anchor="middle">4</text>
    <text class="num" x="133" y="-8" text-anchor="middle">5</text>
    <text class="num" x="-12" y="18" text-anchor="middle">1</text>
    <text class="num" x="-12" y="48" text-anchor="middle">2</text>
    <text class="num" x="-12" y="78" text-anchor="middle">3</text>
    <text class="num" x="-12" y="108" text-anchor="middle">4</text>
    <text class="num" x="-12" y="138" text-anchor="middle">5</text>

    <rect class="cell" x="0" y="0" width="26" height="26" rx="2"/>
    <text class="idx" x="13" y="18" text-anchor="middle">1,1</text>
    <rect class="cell" x="30" y="0" width="26" height="26" rx="2"/>
    <text class="idx" x="43" y="18" text-anchor="middle">1,2</text>
    <rect class="cell" x="60" y="0" width="26" height="26" rx="2"/>
    <text class="idx" x="73" y="18" text-anchor="middle">1,3</text>
    <rect class="cell" x="90" y="0" width="26" height="26" rx="2"/>
    <text class="idx" x="103" y="18" text-anchor="middle">1,4</text>
    <rect class="cell" x="120" y="0" width="26" height="26" rx="2"/>
    <text class="idx" x="133" y="18" text-anchor="middle">1,5</text>

    <rect class="cell" x="0" y="30" width="26" height="26" rx="2"/>
    <text class="idx" x="13" y="48" text-anchor="middle">2,1</text>
    <rect class="cell" x="30" y="30" width="26" height="26" rx="2"/>
    <text class="idx" x="43" y="48" text-anchor="middle">2,2</text>
    <rect class="cell" x="60" y="30" width="26" height="26" rx="2"/>
    <text class="idx" x="73" y="48" text-anchor="middle">2,3</text>
    <rect class="cell" x="90" y="30" width="26" height="26" rx="2"/>
    <text class="idx" x="103" y="48" text-anchor="middle">2,4</text>
    <rect class="cell" x="120" y="30" width="26" height="26" rx="2"/>
    <text class="idx" x="133" y="48" text-anchor="middle">2,5</text>

    <rect class="cell" x="0" y="60" width="26" height="26" rx="2"/>
    <text class="idx" x="13" y="78" text-anchor="middle">3,1</text>
    <rect class="cell" x="30" y="60" width="26" height="26" rx="2"/>
    <text class="idx" x="43" y="78" text-anchor="middle">3,2</text>
    <rect class="cell" x="60" y="60" width="26" height="26" rx="2"/>
    <text class="idx" x="73" y="78" text-anchor="middle">3,3</text>
    <rect class="cell" x="90" y="60" width="26" height="26" rx="2"/>
    <text class="idx" x="103" y="78" text-anchor="middle">3,4</text>
    <rect class="cell" x="120" y="60" width="26" height="26" rx="2"/>
    <text class="idx" x="133" y="78" text-anchor="middle">3,5</text>

    <rect class="cell" x="0" y="90" width="26" height="26" rx="2"/>
    <text class="idx" x="13" y="108" text-anchor="middle">4,1</text>
    <rect class="cell" x="30" y="90" width="26" height="26" rx="2"/>
    <text class="idx" x="43" y="108" text-anchor="middle">4,2</text>
    <rect class="cell" x="60" y="90" width="26" height="26" rx="2"/>
    <text class="idx" x="73" y="108" text-anchor="middle">4,3</text>
    <rect class="cell" x="90" y="90" width="26" height="26" rx="2"/>
    <text class="idx" x="103" y="108" text-anchor="middle">4,4</text>
    <rect class="cell" x="120" y="90" width="26" height="26" rx="2"/>
    <text class="idx" x="133" y="108" text-anchor="middle">4,5</text>

    <rect class="cell" x="0" y="120" width="26" height="26" rx="2"/>
    <text class="idx" x="13" y="138" text-anchor="middle">5,1</text>
    <rect class="cell" x="30" y="120" width="26" height="26" rx="2"/>
    <text class="idx" x="43" y="138" text-anchor="middle">5,2</text>
    <rect class="cell" x="60" y="120" width="26" height="26" rx="2"/>
    <text class="idx" x="73" y="138" text-anchor="middle">5,3</text>
    <rect class="cell" x="90" y="120" width="26" height="26" rx="2"/>
    <text class="idx" x="103" y="138" text-anchor="middle">5,4</text>
    <rect class="cell" x="120" y="120" width="26" height="26" rx="2"/>
    <text class="idx" x="133" y="138" text-anchor="middle">5,5</text>
  </g>
</svg>
